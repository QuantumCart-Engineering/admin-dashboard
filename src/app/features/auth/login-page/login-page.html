<main class="login-page">
  <section class="login-panel">
    <div class="login-brand">
      <img src="assets/images/logo-icon.png" alt="QuantumCart" width="44" height="44" />
      <div class="login-brand__text">
        <span class="login-brand__title">QuantumCart</span>
        <span class="login-brand__sub">Admin console</span>
      </div>
    </div>

    <div class="login-card surface-strong fade-in">
      <span class="badge badge-primary">Administrator access</span>
      <h1>Sign in</h1>
      <p class="login-subtitle">
        Use your QuantumCart administrator credentials. Customer accounts cannot access this console.
      </p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input
            id="email"
            class="input"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="admin@quantumcart.local"
            [attr.aria-invalid]="emailInvalid()"
            [attr.aria-describedby]="emailInvalid() ? 'email-error' : null"
          />
          @if (emailInvalid()) {
            <p class="error-text" id="email-error" role="alert">Enter a valid email address.</p>
          }
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              class="input"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [attr.aria-invalid]="passwordInvalid()"
              [attr.aria-describedby]="passwordInvalid() ? 'password-error' : null"
            />
            <button
              class="password-toggle"
              type="button"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
          @if (passwordInvalid()) {
            <p class="error-text" id="password-error" role="alert">Password is required.</p>
          }
        </div>

        <button class="btn submit" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>
  </section>
</main>
